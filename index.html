<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XG360 Betting App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f14;
  color: white;
}

header {
  background: #111;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #22c55e;
}

.logo {
  color: #22c55e;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.balance {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.card {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.odds {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.odd {
  background: #1f2937;
  padding: 10px;
  border-radius: 6px;
  width: 30%;
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  background: #22c55e;
  border: none;
  border-radius: 10px;
  color: white;
  margin-top: 10px;
}

.vip {
  background: #111827;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  margin-top: 15px;
}

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-around;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">XG360</div>
  <div>GHS 0.00</div>
</header>

<div class="container">

<div class="balance">
  <h2>Balance: GHS 0.00</h2>
  <p>VIP tips unlock after payment</p>
</div>

<div class="card">
  <h3>Arsenal vs Chelsea</h3>
  <div class="odds">
    <div class="odd">1<br>2.10</div>
    <div class="odd">X<br>3.20</div>
    <div class="odd">2<br>3.00</div>
  </div>
</div>

<div class="card">
  <h3>Man United vs Liverpool</h3>
  <div class="odds">
    <div class="odd">1<br>2.50</div>
    <div class="odd">X<br>3.10</div>
    <div class="odd">2<br>2.80</div>
  </div>
</div>

<input type="email" id="email" placeholder="Enter your email">

<button onclick="payNow()">DEPOSIT & UNLOCK VIP</button>

<div class="vip" id="vipBox">
🔒 VIP FIXED GAME  
<br><br>Locked - Deposit to unlock
</div>

</div>

<nav>
<div>🏠 Home</div>
<div>📊 Bets</div>
<div>👤 Profile</div>
</nav>

<script>
function payNow() {
  var email = document.getElementById("email").value;

  if (email === "") {
    alert("Enter your email first");
    return;
  }

  localStorage.setItem("vipUser", "true");
  localStorage.setItem("balance", "5000");

  alert("Redirecting to payment...");

  setTimeout(function () {
    window.location.href = "https://paystack.shop/pay/6imdfbetb8";
  }, 1500);
}

window.onload = function () {
  if (localStorage.getItem("vipUser") === "true") {
    document.getElementById("vipBox").innerHTML =
      "🔥 VIP FIXED GAME<br><br>Arsenal WIN ✅";

    document.querySelector(".balance h2").innerText =
      "Balance: GHS " + localStorage.getItem("balance");
  }
};
</script>

</body>
</html>
