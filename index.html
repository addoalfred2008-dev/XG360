<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XG360 VIP Platform</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f14;
  color: white;
}

header {
  background: #000;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #22c55e;
}

header h1 {
  color: #22c55e;
  margin: 0;
}

.container {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.odds {
  display: flex;
  justify-content: space-between;
}

.odd {
  background: #1f2937;
  padding: 10px;
  border-radius: 8px;
  width: 30%;
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 15px;
  background: #22c55e;
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  margin-top: 15px;
}

.vip {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <h1>XG360</h1>
  <span>VIP Tips Platform</span>
</header>

<div class="container">

  <div class="card">
    <h3>Arsenal vs Chelsea</h3>
    <div class="odds">
      <div class="odd">1<br>2.10</div>
      <div class="odd">X<br>3.20</div>
      <div class="odd">2<br>3.00</div>
    </div>
  </div>

  <div class="card">
    <h3>Man United vs Liverpool</h3>
    <div class="odds">
      <div class="odd">1<br>2.50</div>
      <div class="odd">X<br>3.10</div>
      <div class="odd">2<br>2.80</div>
    </div>
  </div>

  <input type="email" id="email" placeholder="Enter your email">

  <button onclick="payNow()">PAY & UNLOCK VIP</button>

  <div class="vip" id="vipBox">
    🔒 VIP FIXED GAME<br><br>
    Unlock to see today's winning tips
  </div>

</div>

<script>
function payNow() {
  var email = document.getElementById("email").value;

  if (email === "") {
    alert("Enter your email first");
    return;
  }

  localStorage.setItem("vipUser", "true");
  localStorage.setItem("userEmail", email);

  window.location.href = "https://paystack.shop/pay/YOUR-LINK-HERE";
}

// Auto unlock if user already paid
if (localStorage.getItem("vipUser") === "true") {
  document.getElementById("vipBox").innerHTML =
    "🔥 VIP FIXED GAME<br><br>Arsenal WIN ✅<br>Man United WIN ✅";
}
</script>

</body>
</html>
