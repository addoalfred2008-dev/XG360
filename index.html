<!DOCTYPE html>
<html>
<head>
  <title>XG360 VIP Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f14;
      color: white;
    }

    header {
      background: #111;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #22c55e;
    }

    header h1 {
      color: #22c55e;
      margin: 0;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .match {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .odds {
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      color: white;
    }

    .vip {
      text-align: center;
      font-size: 18px;
    }

    .locked {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  <h1>XG360</h1>
  <div>VIP Platform</div>
</header>

<div class="container">

  <div class="card">
    <div class="match">Arsenal vs Chelsea</div>
    <div class="odds">1 - 2.10 | X - 3.20 | 2 - 3.00</div>
  </div>

  <div class="card">
    <div class="match">Man United vs Liverpool</div>
    <div class="odds">1 - 2.50 | X - 3.10 | 2 - 2.80</div>
  </div>

  <input type="email" id="email" placeholder="Enter your email">

  <button onclick="payNow()">PAY & UNLOCK VIP</button>

  <div class="card vip locked" id="vipContent">
    🔒 VIP FIXED GAME<br><br>
    Unlock to see today's winning tips
  </div>

</div>

<script>
function payNow() {
  var email = document.getElementById("email").value;

  if (email === "") {
    alert("Enter your email first");
    return;
  }

  localStorage.setItem("vipUser", email);

  window.location.href = "https://paystack.shop/pay/6imdfbetb8";
}

window.onload = function() {
  var user = localStorage.getItem("vipUser");

  if (user) {
    document.getElementById("vipContent").innerHTML = `
      ✅ VIP UNLOCKED<br><br>

      🔥 Arsenal vs Chelsea — OVER 2.5<br>
      🔥 Man United vs Liverpool — BTTS
    `;
    document.getElementById("vipContent").classList.remove("locked");
  }
};
</script>

</body>
</html>
