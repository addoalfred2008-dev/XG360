<!DOCTYPE html>
<html>
<head>
  <title>XG360 VIP Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    header {
      background: #000;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #22c55e;
    }

    header h1 {
      color: #22c55e;
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .teams {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .odds {
      display: flex;
      justify-content: space-between;
    }

    .odd-box {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      width: 30%;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #22c55e;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }

    .vip-box {
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 20px;
    }

    .lock {
      font-size: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>XG360</h1>
  <span>VIP Tips Platform</span>
</header>

<div class="container">

  <!-- MATCH 1 -->
  <div class="card">
    <div class="teams">Arsenal vs Chelsea</div>
    <div class="odds">
      <div class="odd-box">1<br>2.10</div>
      <div class="odd-box">X<br>3.20</div>
      <div class="odd-box">2<br>3.00</div>
    </div>
  </div>

  <!-- MATCH 2 -->
  <div class="card">
    <div class="teams">Man United vs Liverpool</div>
    <div class="odds">
      <div class="odd-box">1<br>2.50</div>
      <div class="odd-box">X<br>3.10</div>
      <div class="odd-box">2<br>2.80</div>
    </div>
  </div>

  <!-- EMAIL INPUT -->
  <input type="email" id="email" placeholder="Enter your email">

  <!-- BUTTON -->
  <button onclick="payNow()">PAY & UNLOCK VIP</button>

  <!-- LOCKED VIP -->
  <div class="vip-box">
    <div class="lock">🔒 VIP FIXED GAME</div>
    <p>Unlock to see today's winning tips</p>
  </div>

</div>

<!-- SCRIPT (VERY IMPORTANT: ONLY ONE SCRIPT LIKE THIS) -->
<script>
function payNow() {
  var email = document.getElementById("email").value;

  if (email === "") {
    alert("Enter your email first");
    return;
  }

  // Save email
  localStorage.setItem("userEmail", email);

  // Redirect to payment (CHANGE THIS LINK)
  window.location.href = "https://paystack.shop/pay/yourlink";
}
</script>

</body>
</html>
